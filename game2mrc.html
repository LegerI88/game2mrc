<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Sortie de Minuit MRC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: borne d'arcade nocturne — HUD collant, inventaire de chiffres, une scène centrale par mission, ville pixel en fond */
:root{
  --bg:#100b26;
  --panel:#1b1442;
  --panel-2:#251c57;
  --line:#3b2f80;
  --ink:#f3efff;
  --muted:#cdc5f0;
  --cyan:#3ee8ff;
  --pink:#ff4fb8;
  --coin:#ffd23f;
  --good:#4fe08a;
  --bad:#ff4d6d;
  --paper:#f7f2e4;
  --paper-ink:#211b38;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
.crt{position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
b{color:var(--coin);font-weight:600}
.notch{--n:10px;clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.panel{background:var(--panel);box-shadow:inset 0 0 0 3px var(--line);padding:22px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.spr{display:block;image-rendering:pixelated;flex:none}

/* Boutons */
.btn{--n:5px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;color:#170a33;background:var(--coin);border:0;padding:12px 20px;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .08s,filter .15s;clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.btn:focus-visible{box-shadow:inset 0 0 0 3px #fff,inset 0 -5px 0 rgba(0,0,0,.28)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.cyan{background:var(--cyan)}
.btn.pink{background:var(--pink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.ghost:focus-visible{box-shadow:inset 0 0 0 3px var(--cyan)}
.btn.sm{font-size:15px;padding:8px 12px}
.btn.big{font-size:26px;padding:16px 34px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(16,11,38,.92);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 3px var(--line);padding:8px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.hud .l,.hud .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.hud .r{justify-content:flex-end}
.team{font-family:var(--f-display);font-size:18px;color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14ch}
.xp{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:28px;color:var(--coin);font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-mono);font-size:44px;line-height:1;color:var(--cyan);text-shadow:0 0 12px rgba(62,232,255,.55);font-variant-numeric:tabular-nums;text-align:center}
.timer.warn{color:var(--bad);text-shadow:0 0 14px rgba(255,77,109,.7);animation:pulse 1s infinite}
.jokers{display:flex;gap:2px;align-items:center}
.jokers .off{opacity:.18;filter:grayscale(1)}
.tog{font-family:var(--f-body);font-weight:700;font-size:13px;padding:6px 10px!important;background:transparent;color:var(--muted);border:0;box-shadow:inset 0 0 0 2px var(--line);padding:2px 8px;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.tog:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Inventaire */
.inv{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.inv .lbl{font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.slot{width:56px;height:66px;background:#0b0720;box-shadow:inset 0 0 0 3px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:34px;color:var(--line);position:relative}
.slot small{position:absolute;bottom:3px;font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--muted)}
.slot.full{color:var(--coin);box-shadow:inset 0 0 0 3px var(--coin),0 0 16px rgba(255,210,63,.35);animation:pop .5s}
.slot.key.full{box-shadow:inset 0 0 0 3px var(--pink),0 0 16px rgba(255,79,184,.4)}

/* Titre */
.title{align-items:center;text-align:center;gap:22px;padding-block:34px}
.marquee{font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.25em;color:var(--pink);text-shadow:0 0 10px rgba(255,79,184,.7)}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,11vw,108px);line-height:.92;color:var(--ink);text-shadow:5px 0 var(--pink),-5px 0 var(--cyan);animation:glitch 3.4s infinite steps(1)}
.logo span{display:block;font-size:.42em;color:var(--coin);text-shadow:4px 4px 0 #5a1d7a;letter-spacing:.04em;margin-top:10px}
.parade{display:flex;gap:22px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.parade .spr{animation:bob 1.6s ease-in-out infinite}
.parade .spr:nth-child(2){animation-delay:.2s}.parade .spr:nth-child(3){animation-delay:.4s}.parade .spr:nth-child(4){animation-delay:.6s}.parade .spr:nth-child(5){animation-delay:.8s}
.field{display:flex;flex-direction:column;gap:6px;align-items:center}
.field label{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.06em}
.txt{font-family:var(--f-display);font-size:24px;text-align:center;background:#0b0720;color:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:10px 14px;width:min(360px,100%)}
.txt:focus{outline:none;box-shadow:inset 0 0 0 3px var(--cyan)}
.blink{animation:blink 1.1s steps(1) infinite;font-family:var(--f-display);font-size:20px;color:var(--coin)}
.rules{font-family:var(--f-body);font-size:16px;color:var(--muted)}
.credit{font-size:15px;color:var(--muted)}
.credit strong{color:var(--ink);font-weight:700;letter-spacing:.03em}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer}
.linkish:focus-visible{outline:2px solid var(--cyan)}

/* Dialogue */
.talk{display:flex;gap:14px;align-items:flex-start}
.talk .spr{animation:bob 2s ease-in-out infinite}
.talk.talking .spr{animation:talk .16s steps(2) infinite}
@keyframes talk{50%{transform:translateY(-3px) scaleY(.92)}}
.bubble{flex:1;min-width:0;background:var(--panel-2);box-shadow:inset 0 0 0 3px var(--line);padding:12px 16px;position:relative}
.bubble b.who{display:block;font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--pink);letter-spacing:.1em;margin-bottom:4px}
.bubble p{font-size:18px;min-height:2.6em;cursor:pointer}

/* Carte */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--panel-2);color:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:18px 10px 14px;cursor:pointer;font:inherit;transition:transform .15s}
.node:hover:not(:disabled){transform:translateY(-4px)}
.node:focus-visible{box-shadow:inset 0 0 0 3px var(--cyan)}
.node h3{font-size:22px}
.node .tag{font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.05em}
.node .st{font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:.08em}
.node.locked{opacity:.45;cursor:not-allowed}
.node.locked .spr{filter:grayscale(1) brightness(.6)}
.node.cur{box-shadow:inset 0 0 0 3px var(--coin),0 0 22px rgba(255,210,63,.35)}
.node.cur .st{color:var(--coin);animation:blink 1s steps(1) infinite}
.node.done{box-shadow:inset 0 0 0 3px var(--good)}
.node.done .st{color:var(--good)}
.node.boss.cur{box-shadow:inset 0 0 0 3px var(--pink),0 0 26px rgba(255,79,184,.45)}

/* Niveau */
.lvl-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.lvl-top h2{font-size:clamp(30px,5vw,44px)}
.pips{list-style:none;display:flex;gap:8px;margin:0;padding:0;flex-wrap:wrap}
.pips li{width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:#0b0720;box-shadow:inset 0 0 0 3px var(--line);color:var(--muted)}
.pips li.done{background:var(--good);color:#0b2a17;box-shadow:none}
.pips li.cur{box-shadow:inset 0 0 0 3px var(--coin);color:var(--coin);animation:pulse 1.4s infinite}
.q{font-size:19px;font-weight:600;max-width:65ch}
.step{position:relative;display:flex;flex-direction:column;gap:16px;animation:slideIn .35s ease-out}
.step.locked>*:not(.lockov){filter:blur(1.5px) grayscale(.7);pointer-events:none;user-select:none}
.lockov{position:absolute;inset:-6px;z-index:5;display:grid;place-items:center;background:rgba(11,7,32,.7);padding:12px}
.lockbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:440px;padding:20px;background:var(--panel);box-shadow:inset 0 0 0 3px var(--bad)}
.lockbox .lt{font-family:var(--f-display);font-size:28px;color:var(--bad)}
.lockbox .ln{font-family:var(--f-mono);font-size:76px;line-height:1;color:var(--coin);font-variant-numeric:tabular-nums}
.lockbox p{font-size:16px}
.answer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inp{font-family:var(--f-mono);font-size:30px;background:#0b0720;color:var(--coin);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:4px 10px;width:7ch;text-align:center;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;box-shadow:inset 0 0 0 3px var(--cyan)}
.inp.ok{box-shadow:inset 0 0 0 3px var(--good);color:var(--good)}
.inp.ko{box-shadow:inset 0 0 0 3px var(--bad);color:var(--bad);animation:shake .4s}
.unit{font-family:var(--f-body);font-weight:600;font-size:18px;color:var(--muted)}
.fb{padding:14px 16px;box-shadow:inset 0 0 0 3px var(--line);background:#0b0720;display:flex;flex-direction:column;gap:12px;animation:pop .3s}
.fb.ok{box-shadow:inset 0 0 0 3px var(--good)}
.fb.ko{box-shadow:inset 0 0 0 3px var(--bad)}
.fb .h{font-family:var(--f-display);font-size:24px}
.fb.ok .h{color:var(--good)}
.fb.ko .h{color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel-2);color:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:14px;font:inherit;font-size:17px;cursor:pointer;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateX(4px);box-shadow:inset 0 0 0 3px var(--cyan)}
.opt:focus-visible{box-shadow:inset 0 0 0 3px var(--cyan)}
.opt .key{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--line);font-family:var(--f-display);color:var(--coin)}
.opt.right{box-shadow:inset 0 0 0 3px var(--good);background:#143a2a}
.opt.wrong{box-shadow:inset 0 0 0 3px var(--bad);opacity:.6;animation:shake .4s}
.opt:disabled{cursor:default}

/* Documents papier */
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.paper{background:var(--paper);color:var(--paper-ink);padding:14px 16px;font-size:15px;box-shadow:6px 6px 0 rgba(0,0,0,.35);transform:rotate(-.6deg);min-width:0}
.paper:nth-child(2){transform:rotate(.7deg)}
.paper h4{font-family:var(--f-body);font-weight:700;font-size:16px;margin:0 0 2px}
.paper .meta{font-size:13px;color:#5a5275;margin-bottom:8px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th,.paper td{border-bottom:1px dashed #b9b0cc;padding:5px 4px;text-align:left}
.paper td.n,.paper th.n{text-align:right}
.paper .stamp{display:inline-block;margin-top:8px;font-family:var(--f-body);font-weight:700;font-size:13px;color:#c2185b;border:2px solid #c2185b;padding:0 6px;transform:rotate(-4deg)}
.note{background:#fff27a;color:#2a2200;padding:10px 14px;font-size:15px;box-shadow:4px 4px 0 rgba(0,0,0,.35);transform:rotate(-1.2deg);max-width:420px}
.tbl-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
table.grid th{font-family:var(--f-body);font-weight:700;font-size:14px;text-transform:uppercase;color:var(--cyan);text-align:left;padding:10px 8px;border-bottom:3px solid var(--line);letter-spacing:.06em}
table.grid th.n,table.grid td.c{text-align:center}
table.grid td{padding:8px;border-bottom:2px solid var(--line);font-size:17px}
table.grid td.n{text-align:center;font-weight:700;font-size:20px}
table.grid .inp{font-size:24px;width:5ch}

/* Scène livraison */
.dock{position:relative;height:110px;overflow:hidden;background:linear-gradient(transparent 82%,#2b2260 82%)}
.truck{position:absolute;left:8px;bottom:6px;animation:truckIn 1.6s cubic-bezier(.2,.8,.3,1) both}
.cartons{position:absolute;right:14px;bottom:10px;display:flex;gap:6px;align-items:flex-end}
.drop{animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
.d1{animation-delay:1.5s}.d2{animation-delay:1.7s}.d3{animation-delay:1.9s}

/* Étagère */
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px;padding:14px;background:#0b0720;box-shadow:inset 0 0 0 3px var(--line)}
.item{display:grid;place-items:center;height:76px;background:none;border:0;border-bottom:6px solid #5a4a9a;cursor:pointer;position:relative}
.item:focus-visible{outline:2px solid var(--cyan)}
.item.mark::after{content:"✓";position:absolute;top:0;right:6px;font-family:var(--f-display);font-size:24px;color:var(--good);text-shadow:2px 2px 0 #000}
.item.nope{animation:shake .4s}

/* Produits / gondole */
.prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.prod{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--panel-2);box-shadow:inset 0 0 0 3px var(--line);padding:12px 8px;color:var(--ink);border:0;font:inherit;min-width:0}
button.prod{cursor:pointer;transition:transform .15s}
button.prod:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 3px var(--cyan)}
button.prod:focus-visible{box-shadow:inset 0 0 0 3px var(--cyan)}
.prod .num{font-family:var(--f-display);font-size:22px;color:var(--coin)}
.prod .nm{font-weight:600;font-size:15px;line-height:1.25}
.prod .px{font-size:15px;color:var(--muted);line-height:1.35}
.prod .inp{font-size:24px;width:5ch}
.gondola{display:flex;flex-direction:column;gap:0;background:#0b0720;box-shadow:inset 0 0 0 3px var(--line);padding:10px 14px}
.lvlrow{display:flex;align-items:center;gap:14px;min-height:70px;border-bottom:8px solid #6b58b8}
.lvlrow .lab{font-family:var(--f-body);font-weight:700;font-size:14px;text-transform:uppercase;color:var(--muted);width:150px;flex:none}
.lvlrow.eyes{background:linear-gradient(90deg,rgba(255,210,63,.12),transparent)}
.lvlrow.eyes .lab{color:var(--coin)}
.lvlrow .spot{flex:1;display:flex;align-items:center;gap:10px;min-height:60px}
.lvlrow .ph{font-size:14px;color:#9a8fd4}
.landed{animation:land .6s cubic-bezier(.3,1.5,.5,1)}

/* Jaquettes */
.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.game{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;cursor:pointer;color:#fff;font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:inset 0 0 0 3px var(--line);transition:transform .15s}
.game:hover{transform:translateY(-5px) rotate(-1deg)}
.game:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.game .art{position:absolute;inset:0}
.game .t{position:relative;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-direction:column;gap:2px}
.game .t strong{font-family:var(--f-display);font-size:21px;line-height:1}
.game .t span{font-size:13px;color:#e7e0ff}
.pegi{position:absolute;left:8px;top:8px;width:46px;padding:3px 0 4px;text-align:center;color:#fff;font-family:var(--f-body);font-weight:700;line-height:1;box-shadow:0 0 0 2px #fff}
.pegi i{display:block;font-style:normal;font-size:9px;letter-spacing:.06em}
.pegi em{display:block;font-style:normal;font-size:24px}
.pegi.g{background:#2fa84f}.pegi.o{background:#f39200}.pegi.r{background:#e3051b}
.game.sel{box-shadow:inset 0 0 0 5px var(--coin),0 0 22px rgba(255,210,63,.5)}
.game.sel::after{content:"✓";position:absolute;right:8px;top:6px;font-family:var(--f-display);font-size:30px;color:var(--coin);text-shadow:2px 2px 0 #000}

/* Boss */
.bossbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:10px;background:radial-gradient(circle at 50% 60%,rgba(255,79,184,.25),transparent 65%)}
.bossbox .spr{animation:bossIdle 1.2s ease-in-out infinite}
.bossbox.hidden .spr{filter:brightness(0) drop-shadow(0 0 8px var(--pink));animation:none}
.bossbox.hurt .spr{animation:hurt .5s}
.hp{display:flex;flex-direction:column;gap:6px;min-width:220px}
.hp .nm{font-family:var(--f-display);font-size:22px;color:var(--pink)}
.hpbar{height:22px;background:#0b0720;box-shadow:inset 0 0 0 3px var(--line);padding:4px}
.hpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--bad) 0 10px,#ff7b93 10px 12px);transition:width .5s steps(6)}
.ticket{background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:12px 16px;max-width:360px;box-shadow:6px 6px 0 rgba(0,0,0,.35);line-height:1.6}
.ticket .tl{display:flex;justify-content:space-between;gap:12px}
.ticket hr{border:0;border-top:2px dashed #9a91b6;margin:6px 0}
.tray{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.money{border:0;cursor:pointer;color:#14082e;transition:transform .1s;display:grid;place-items:center;padding:0}
.money span{display:inline-block;background:#fff;color:#14082e;font-family:var(--f-body);font-weight:800;line-height:1;padding:5px 7px;box-shadow:0 0 0 2px rgba(0,0,0,.35);white-space:nowrap}
.coinb span{border-radius:999px;padding:6px 5px;font-size:16px}
.c2 span,.c1 span{font-size:20px;padding:7px 9px}
.money:active{transform:scale(.92)}

/* --- Aides de construction d'étapes --- */
function numQ(box,api,o){
  box.innerHTML=`${o.html||''}<p class="q">${o.q}</p><div class="answer"><input class="inp" id="${o.id}" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><span class="unit">${o.unit||''}</span><button class="btn" id="${o.id}-go">Valider</button></div>`;
  const i=$('#'+o.id),b=$('#'+o.id+'-go');
  const go=()=>{const v=num(i.value);if(isNaN(v)){api.ko('Écris un nombre (tu peux utiliser une virgule, par exemple 7,50).',true);shake(i);return;}
    if(near(v,o.expect)){i.classList.add('ok');i.disabled=true;b.disabled=true;api.ok(o.ok);}
    else{i.classList.remove('ko');void i.offsetWidth;i.classList.add('ko');api.ko(typeof o.ko==='function'?o.ko(v):o.ko);}};
  b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go();};
}
function qcm(box,api,o){
  box.innerHTML=`${o.html||''}<p class="q">${o.q}</p><div class="opts">${o.opts.map((t,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${t}</span></button>`).join('')}</div>`;
  $$('.opt',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(i===o.correct){b.classList.add('right');$$('.opt',box).forEach(x=>x.disabled=true);api.ok(o.ok);}
    else{b.classList.add('wrong');b.disabled=true;api.ko(o.ko[i]||'Ce n\'est pas la bonne réponse.');}});
}
function multiCheck(box,api,ids,expect,okMsg,koFn){
  const vals=ids.map(id=>num($('#'+id).value));
  if(vals.some(isNaN)){api.ko('Remplis toutes les cases avec un nombre.',true);return;}
  let bad=[];ids.forEach((id,k)=>{const el=$('#'+id);if(near(vals[k],expect[k])){el.classList.add('ok');el.disabled=true;}else{el.classList.remove('ko');void el.offsetWidth;el.classList.add('ko');bad.push(k);}});
  if(!bad.length){box.querySelector('[data-go]').disabled=true;api.ok(okMsg);}else api.ko(koFn(bad));
}

function classify(box,api,o){
  const pick={};
  box.innerHTML=`${o.html||''}<p class="q">${o.q}</p><div class="cls">${o.items.map((it,i)=>`<div class="cls-row" id="cr${i}"><span class="it">${it.t}</span><div class="seg" role="group" aria-label="Catégorie">${o.cats.map((c,k)=>`<button data-i="${i}" data-k="${k}" aria-pressed="false">${c}</button>`).join('')}</div></div>`).join('')}</div><div class="row"><button class="btn" data-go>Valider</button></div>`;
  $$('.seg button',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;pick[i]=+b.dataset.k;$$(`.seg button[data-i="${i}"]`,box).forEach(x=>x.setAttribute('aria-pressed',x===b));SFX.click();});
  box.querySelector('[data-go]').onclick=()=>{
    if(Object.keys(pick).length<o.items.length){api.ko('Choisis une catégorie pour chaque ligne.',true);return;}
    let bad=0;o.items.forEach((it,i)=>{const r=$('#cr'+i);r.classList.remove('okk','bad');if(pick[i]===it.c)r.classList.add('okk');else{r.classList.add('bad');bad++;}});
    if(!bad){$$('button',box).forEach(x=>x.disabled=true);api.ok(o.ok);}
    else api.ko(`${bad} ligne${bad>1?'s sont':' est'} mal classée${bad>1?'s':''} (en rouge). ${o.koTip||''}`);
  };
}
function orderQ(box,api,o){
  let seq=[];
  box.innerHTML=`${o.html||''}<p class="q">${o.q}</p><div class="ord">${o.shuffled.map(i=>`<button data-i="${i}"><span class="badge">·</span><span>${o.steps[i]}</span></button>`).join('')}</div><div class="row"><button class="btn ghost sm" data-r>Recommencer l'ordre</button><button class="btn" data-go>Valider</button></div>`;
  const draw=()=>{$$('.ord button',box).forEach(b=>{const p=seq.indexOf(+b.dataset.i);b.classList.toggle('on',p>=0);b.querySelector('.badge').textContent=p>=0?p+1:'·';});};
  $$('.ord button',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const p=seq.indexOf(i);if(p>=0)seq.splice(p,1);else seq.push(i);SFX.click();draw();});
  box.querySelector('[data-r]').onclick=()=>{seq=[];draw();};
  box.querySelector('[data-go]').onclick=()=>{
    if(seq.length<o.steps.length){api.ko('Clique sur toutes les étapes, dans l\'ordre.',true);return;}
    if(seq.every((v,k)=>v===k)){$$('button',box).forEach(x=>x.disabled=true);api.ok(o.ok);}
    else{const first=seq.findIndex((v,k)=>v!==k);api.ko(`${first===0?'La première étape n\'est pas la bonne.':first===1?'Seule la première étape est bien placée.':'Les '+first+' premières étapes sont bien placées, la suite non.'} ${o.koTip||''}`);}
  };
}

function applyLock(hk){
  const lk=S.lockUntil;if(!lk||lk.k!==hk||lk.t<=Date.now())return;

  let ov=$('#lockov');if(!ov){ov=document.createElement('div');ov.id='lockov';ov.className='lockov';ov.setAttribute('role','status');stepEl.appendChild(ov);}
  stepEl.classList.add('locked');clearInterval(lockTimer);
  const tick=()=>{const left=Math.ceil((lk.t-Date.now())/1000);
    if(left<=0||!ov.isConnected){clearInterval(lockTimer);if(ov.isConnected){ov.remove();stepEl.classList.remove('locked');SFX.click();}return;}
    ov.innerHTML=`<div class="lockbox"><span class="lt">RÉPONSE BLOQUÉE</span><span class="ln">${left}</span><p>Pas de clic au hasard ! Relis la question et l'explication, ouvre la fiche mémo ou utilise un joker.</p></div>`;};
  tick();lockTimer=setInterval(tick,250);
}

/* ---------- Grand final ---------- */
SFX.boom=()=>fx(t=>{noiseHit(AE.fx,t,1.2,.7,60);tone(AE.fx,'sine',90,t,.9,.6,30);});

SFX.applause=sec=>fx(t=>{for(let i=0;i<sec*45;i++)noiseHit(AE.fx,t+Math.random()*sec,.04+Math.random()*.05,.05+Math.random()*.08,1200+Math.random()*3000);});
SFX.stamp=()=>fx(t=>{noiseHit(AE.fx,t,.25,.5,150);tone(AE.fx,'square',110,t,.2,.2,50);});
SFX.badge=k=>fx(t=>{[0,4,7,12].forEach((d,j)=>tone(AE.fx,'square',mf(74+(k%6)*2+d),t+j*.045,.1,.1));});
let fwRun=null;
function fireworks(ms){
  if(REDUCE||ms<=0)return;let c=$('#fw');if(!c){c=document.createElement('canvas');c.id='fw';c.setAttribute('aria-hidden','true');document.body.appendChild(c);}
  const x=c.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ffd23f','#3ee8ff','#ff4fb8','#4fe08a','#f3efff','#ff8a3d','#7b5cff'];const rockets=[],parts=[];let next=0;const end=performance.now()+ms;
  cancelAnimationFrame(fwRun);
  const loop=t=>{x.clearRect(0,0,innerWidth,innerHeight);
    if(t<end&&t>next){rockets.push({x:innerWidth*(.08+Math.random()*.84),y:innerHeight,vy:-(10+Math.random()*5),ty:innerHeight*(.1+Math.random()*.38),c:cols[Math.floor(Math.random()*cols.length)]});next=t+220+Math.random()*420;SFX.whistle();}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy;r.vy*=.985;x.fillStyle='#fff';x.fillRect(Math.round(r.x),Math.round(r.y),3,6);x.globalAlpha=.6;x.fillStyle=r.c;x.fillRect(Math.round(r.x),Math.round(r.y)+6,3,10);x.globalAlpha=1;
      if(r.y<=r.ty||r.vy>-1.5){const n=55+Math.floor(Math.random()*35),sp=3+Math.random()*3.5,ring=Math.random()<.4;for(let k=0;k<n;k++){const a=k/n*Math.PI*2,v=ring?sp:sp*Math.random();parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*35,c:Math.random()<.2?'#ffffff':r.c,s:Math.random()<.3?4:3});}rockets.splice(i,1);SFX.burst();}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=.06;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0){parts.splice(i,1);continue;}x.globalAlpha=Math.min(1,p.l/30);x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}
    x.globalAlpha=1;
    if(t<end||rockets.length||parts.length)fwRun=requestAnimationFrame(loop);else x.clearRect(0,0,innerWidth,innerHeight);};
  fwRun=requestAnimationFrame(loop);
}
function crowd(n){let h='';for(let i=0;i<n;i++)h+=`<span class="fan" style="animation-delay:${(i*137)%600}ms">${spr('p'+(i%4+1),6)}</span>`;return h;}
let finT=[];

  const old=$('#finale');if(old)old.remove();
  const root=document.createElement('div');root.className='finale';root.id='finale';root.setAttribute('role','dialog');root.setAttribute('aria-label','Mission accomplie');
  root.innerHTML=`<div class="fin-inner">
    <div class="fin-title">${['MISSION','ACCOMPLIE !'].map(w=>`<span class="w">${w.split('').map(c=>`<span class="l">${c===' '?'&nbsp;':c}</span>`).join('')}</span>`).join('')}</div>
    <div class="fin-team">BRAVO ${esc(S.team.toUpperCase())} !</div>
    <div class="talk fin-talk">${spr('sam',6)}<div class="bubble"><b class="who">SAM · responsable du Pixel Shop</b><p id="fin-say"></p></div></div>
    <div class="crowd">${crowd(14)}</div>
    <button class="btn big pink" id="fin-next" hidden>Voir nos résultats ▶</button></div>`;
  document.body.appendChild(root);
  const later=(ms,fn)=>finT.push(setTimeout(fn,REDUCE?0:ms));
  SFX.boom();flash('white');fireworks(15000);
  const ls=$$('.fin-title .l',root);
  ls.forEach((l,i)=>later(350+i*85,()=>{l.classList.add('in');SFX.slam(i);}));
  const tEnd=350+ls.length*85+150;
  later(tEnd,()=>{SFX.boom();shake($('.fin-inner',root));confetti(240);});
  later(tEnd+350,()=>{$('.fin-team',root).classList.add('in');$('.crowd',root).classList.add('on');SFX.applause(3.5);});
  later(tEnd+1400,()=>{$('.fin-talk',root).classList.add('in');typewrite($('#fin-say'),GAME_INFO.sam,'sam');});
  later(tEnd+2600,()=>{const b=$('#fin-next');b.hidden=false;b.focus({preventScroll:true});});
  $('#fin-next').onclick=()=>{finT.forEach(clearTimeout);clearTimeout(twTimer);SFX.click();root.classList.add('out');setTimeout(()=>root.remove(),450);go('end');};
}
function hofUpdate(){
  const key=SAVE_KEY+'-hof';let list=[];try{list=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){list=[];}
  const id=S.finishedAt||0;
  if(id&&!list.some(e=>e.id===id)){list.push({id,team:S.team,xp:S.xp,time:S.timeUp?null:Math.max(0,S.duration*60-S.timeLeft),date:new Date(id).toLocaleDateString('fr-FR')});
    list.sort((a,b)=>b.xp-a.xp||((a.time==null?1e9:a.time)-(b.time==null?1e9:b.time)));list=list.slice(0,10);try{localStorage.setItem(key,JSON.stringify(list));}catch(e){}}
  const pos=list.findIndex(e=>e.id===id);return {list,pos,top:pos===0};
}

function certHof(HOF,rank){

    <p class="cert-k">PIXEL SHOP · ESCAPE GAME</p><h3>Certificat de réussite</h3>

}
function endFx(){
  const pc=$('#printc');if(pc)pc.onclick=()=>{let z=$('#printzone');if(!z){z=document.createElement('div');z.id='printzone';document.body.appendChild(z);}z.innerHTML=$('#cert').outerHTML.replace('id="cert"','id="cert-print"');setTimeout(()=>{try{window.print();}catch(e){}},60);};
  const ag=$('#again');if(ag){const r=ag.closest('.row');if(r){r.classList.add('endrow');stage.appendChild(r);}}
  if(REDUCE)return;
  fireworks(9000);
  const el=$('#xpc'),target=S.xp,t0=performance.now(),dur=2200;let last=0;
  const step=t=>{if(!el.isConnected)return;const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(t-last>70){SFX.tick();last=t;}
    if(p<1)requestAnimationFrame(step);else{$('#rk').classList.add('in');SFX.stamp();shake($('.endhero'));confetti(220);}};
  requestAnimationFrame(step);
  $$('.bdg').forEach((b,i)=>setTimeout(()=>{if(!b.isConnected)return;b.classList.add('in');SFX.badge(i);},2700+i*380));
}

  endFx();
